[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ashwingopalsamy"
version = "1.0.0"
description = "Official Python SDK for Ashwin Gopalsamy's developer API, profile, notes, and search index"
readme = "README.md"
authors = [{ name = "Ashwin Gopalsamy", email = "hello@ashwingopalsamy.in" }]
license = { text = "MIT" }
keywords = ["ashwingopalsamy", "sdk", "api", "mcp", "agent-readiness", "payments"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "urllib3>=1.26.0",
]

[project.urls]
Homepage = "https://ashwingopalsamy.in/developers"
Documentation = "https://ashwingopalsamy.in/developers"
Repository = "https://github.com/ashwingopalsamy/site"
"OpenAPI Specification" = "https://ashwingopalsamy.in/openapi.json"
"MCP Server" = "https://ashwingopalsamy.in/mcp"

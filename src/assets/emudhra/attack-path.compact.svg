<svg xmlns="http://www.w3.org/2000/svg" data-layout="compact" viewBox="0 0 352 552" role="img" aria-labelledby="attack-path-tc attack-path-dc" style="aspect-ratio: 352 / 552"><title id="attack-path-tc">A fake certificate only works on an app that skips blocklists.</title><desc id="attack-path-dc">A fake bank certificate needs an attacker on your network and an app that skips blocklists, so updated browsers reject it and old programs accept it.</desc><style>:is(#fig-attack-path,[data-fig-clone="attack-path"]) text{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif;font-weight:400}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .s{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .m{font-family:"JetBrains Mono","JetBrains Mono Fallback",ui-monospace,monospace}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .f14{font-size:14px}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .w{font-weight:550}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .mid{text-anchor:middle}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .ink{fill:var(--ink,#151617)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .ghost{fill:var(--ghost,#6c6f72)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .key{fill:var(--acc-violet,#7844f0)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .ok{fill:var(--acc-green,#20b46b)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .cv{fill:var(--canvas,#ffffff)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .okbox{fill:var(--ok-wash,rgba(32,180,107,0.13));stroke:var(--acc-green,#20b46b);stroke-width:1}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .edge{stroke:var(--ink,#151617);stroke-opacity:.7;stroke-width:1}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .bad{stroke:var(--acc-red,#ee343b);stroke-width:1.5}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .washb{fill:var(--err-wash,rgba(238,52,59,0.11))}:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.axis,:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.edge,:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.bad,:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.hl{fill:none}:is(#fig-attack-path,[data-fig-clone="attack-path"]) svg[data-layout="compact"]{display:none}@container fig (max-width:559px){:is(#fig-attack-path,[data-fig-clone="attack-path"]) svg[data-layout="wide"]{display:none}:is(#fig-attack-path,[data-fig-clone="attack-path"]) svg[data-layout="compact"]{display:block}}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .acg,:is(#fig-attack-path,[data-fig-clone="attack-path"]) .acr{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .st,:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .rjg{opacity:0;transform:translateY(4px)}}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .fk{opacity:0}}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .acg{opacity:0;transform:scale(.96)}}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .rjr,:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .acr{fill:var(--canvas,#ffffff);stroke:var(--edge,rgba(21,22,23,0.11))}}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .st{animation:attack-path-rise var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(var(--k)*var(--dur-enter,240ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .fk{animation:attack-path-fade var(--dur-tint,110ms) linear both;animation-delay:calc(4*var(--dur-enter,240ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .rjg{animation:attack-path-rise var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(4*var(--dur-enter,240ms) + var(--dur-tint,110ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .rjr{animation:attack-path-ok var(--dur-tint,110ms) linear both;animation-delay:calc(5*var(--dur-enter,240ms) + var(--dur-tint,110ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .acg{animation:attack-path-grow var(--dur-spring-pop,313ms) var(--ease-spring-pop,linear(0, 0.0911, 0.2968, 0.5354, 0.7535, 0.9229, 1.0354, 1.0956, 1.115, 1.1072, 1.0846, 1.0572, 1.0315, 1.0111, 0.9973, 0.9896, 0.9868, 0.9874, 0.9898, 0.993, 1)) both;animation-delay:calc(5*var(--dur-enter,240ms) + var(--dur-tint,110ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .acr{animation:attack-path-bad var(--dur-tint,110ms) linear both;animation-delay:calc(5*var(--dur-enter,240ms) + var(--dur-tint,110ms))}@keyframes attack-path-rise{from{opacity:0;transform:translateY(4px)}}@keyframes attack-path-fade{from{opacity:0}}@keyframes attack-path-grow{from{opacity:0;transform:scale(.96)}}@keyframes attack-path-ok{from{fill:var(--canvas,#ffffff);stroke:var(--edge,rgba(21,22,23,0.11))}}@keyframes attack-path-bad{from{fill:var(--canvas,#ffffff);stroke:var(--edge,rgba(21,22,23,0.11))}}@media (prefers-reduced-motion:reduce){:is(#fig-attack-path,[data-fig-clone="attack-path"]) *{animation:none!important}}</style><g class="st" data-beat="1" style="--k: 0"><rect x="16" y="16" width="320" height="76" rx="8" class="cv edge node" data-mark="step-1"/><text x="32" y="48" class="m f14 ghost">1</text><text x="56" y="48"><tspan class="s f14 ink">The attacker sits between you</tspan></text><text x="56" y="68"><tspan class="s f14 ink">and the server.</tspan></text></g><g class="st" data-beat="2" style="--k: 1"><path d="M176 92V116" class="edge"/><path d="M173 112L176 116L179 112" class="edge"/><rect x="16" y="116" width="320" height="96" rx="8" class="cv edge node" data-mark="step-2"/><text x="32" y="148" class="m f14 ghost">2</text><text x="56" y="148"><tspan class="s f14 ink">The attacker knows a stamp's</tspan></text><text x="56" y="168"><tspan class="s f14 ink">secret key. Anyone can,</tspan></text><text x="56" y="188"><tspan class="s f14 ink">because it is </tspan><tspan class="m f14 w key">1 to 255</tspan><tspan class="s f14 ink">.</tspan></text></g><g class="st" data-beat="3" style="--k: 2"><path d="M176 212V236" class="edge"/><path d="M173 232L176 236L179 232" class="edge"/><rect x="16" y="236" width="320" height="76" rx="8" class="cv edge node" data-mark="step-3"/><text x="32" y="268" class="m f14 ghost">3</text><text x="56" y="268"><tspan class="s f14 ink">The attacker makes a fake</tspan></text><text x="56" y="288"><tspan class="s f14 ink">certificate for your bank.</tspan></text></g><g class="st" data-beat="4" style="--k: 3"><path d="M176 312V336" class="edge"/><path d="M173 332L176 336L179 332" class="edge"/><rect x="16" y="336" width="320" height="76" rx="8" class="cv edge node" data-mark="step-4"/><text x="32" y="368" class="m f14 ghost">4</text><text x="56" y="368"><tspan class="s f14 ink">Your app accepts it, unless</tspan></text><text x="56" y="388"><tspan class="s f14 ink">it checks blocklists.</tspan></text></g><g class="fk" data-beat="5"><path d="M176 412V428H92V448M176 428H260V448" class="edge"/><path d="M89 444L92 448L95 444" class="edge"/><path d="M257 444L260 448L263 444" class="edge"/></g><g class="rjg" data-beat="6" data-mark="rejects"><rect x="16" y="448" width="152" height="88" rx="8" class="okbox rjr node"/><circle cx="92" cy="472" r="6" class="ok"/><path d="M89 472L91 474L95 470" fill="none" stroke="var(--canvas,#ffffff)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="500" class="s f14 ink mid">Updated browser</text><text x="92" y="520" class="s f14 w ink mid">rejects it</text></g><g class="acg" data-beat="7" data-mark="accepts"><rect x="184" y="448" width="152" height="88" rx="8" class="washb bad acr node"/><circle cx="260" cy="472" r="5.25" fill="none" class="bad"/><text x="260" y="500" class="s f14 ink mid">Old program</text><text x="260" y="520" class="s f14 w ink mid">accepts it</text></g></svg>

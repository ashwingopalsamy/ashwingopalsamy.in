<svg xmlns="http://www.w3.org/2000/svg" data-layout="compact" viewBox="0 0 352 360" role="img" aria-labelledby="go-fix-flow-tc go-fix-flow-dc" style="aspect-ratio: 352 / 360"><title id="go-fix-flow-tc">Rebuild first. The deny-list is only a bridge.</title><desc id="go-fix-flow-dc">Go teams find each binary's Go version, rebuild with 1.27.3 or 1.26.10, update ca-certificates, redeploy with a canary, and use the deny-list only if stuck.</desc><style>:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) text{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif;font-weight:400}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .s{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .m{font-family:"JetBrains Mono","JetBrains Mono Fallback",ui-monospace,monospace}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .f14{font-size:14px}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .ink{fill:var(--ink,#151617)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .ghost{fill:var(--ghost,#6c6f72)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .ok{fill:var(--acc-green,#20b46b)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .cv{fill:var(--canvas,#ffffff)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .edge{stroke:var(--ink,#151617);stroke-opacity:.7;stroke-width:1}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .dash{stroke-dasharray:2 2}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .dash43{stroke-dasharray:4 3}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.axis,:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.edge,:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.bad,:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.hl{fill:none}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) svg[data-layout="compact"]{display:none}@container fig (max-width:559px){:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) svg[data-layout="wide"]{display:none}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) svg[data-layout="compact"]{display:block}}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .mp{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"])[data-armed]:not([data-play]) .rw{opacity:0;transform:translateY(4px)}}@media (prefers-reduced-motion:no-preference){:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"])[data-armed]:not([data-play]) .mt{fill:var(--wash,rgba(21,22,23,0.045))}}@media (prefers-reduced-motion:no-preference){:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"])[data-armed]:not([data-play]) .mp{opacity:0;transform:scale(.5)}}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"])[data-armed][data-play] .rw{animation:go-fix-flow-rise var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(var(--k)*8*var(--dur-stagger,16ms))}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"])[data-armed][data-play] .mt{animation:go-fix-flow-tint var(--dur-tint,110ms) linear both;animation-delay:calc(calc(var(--k)*8*var(--dur-stagger,16ms)) + var(--dur-enter,240ms))}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"])[data-armed][data-play] .mp{animation:go-fix-flow-pop var(--dur-spring-pop,313ms) var(--ease-spring-pop,linear(0, 0.0911, 0.2968, 0.5354, 0.7535, 0.9229, 1.0354, 1.0956, 1.115, 1.1072, 1.0846, 1.0572, 1.0315, 1.0111, 0.9973, 0.9896, 0.9868, 0.9874, 0.9898, 0.993, 1)) both;animation-delay:calc(calc(var(--k)*8*var(--dur-stagger,16ms)) + var(--dur-enter,240ms))}@keyframes go-fix-flow-rise{from{opacity:0;transform:translateY(4px)}}@keyframes go-fix-flow-tint{from{fill:var(--wash,rgba(21,22,23,0.045))}}@keyframes go-fix-flow-pop{from{opacity:0;transform:scale(.5)}}@media (prefers-reduced-motion:reduce){:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) *{animation:none!important}}</style><g class="rw" data-beat="1" style="--k: 0"><rect x="16" y="16" width="320" height="56" rx="8" class="cv edge node" data-mark="find"/><circle cx="40" cy="44" r="6" class="ok mt"/><path d="M37 44L39 46L43 42" fill="none" stroke="var(--canvas,#ffffff)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="48"><tspan class="s f14 ink">Find which Go built each binary</tspan></text></g><g class="rw" data-beat="2" style="--k: 1"><path d="M40 72V84" class="edge"/><rect x="16" y="84" width="320" height="56" rx="8" class="cv edge node" data-mark="rebuild"/><g class="mp"><circle cx="40" cy="112" r="6" class="ok"/><path d="M37 112L39 114L43 110" fill="none" stroke="var(--canvas,#ffffff)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="108"><tspan class="s f14 ink">Rebuild with Go</tspan></text><text x="64" y="128"><tspan class="m f14 ink">1.27.3</tspan><tspan class="s f14 ink"> or </tspan><tspan class="m f14 ink">1.26.10</tspan></text></g><g class="rw" data-beat="3" style="--k: 2"><path d="M40 140V152" class="edge"/><rect x="16" y="152" width="320" height="56" rx="8" class="cv edge node" data-mark="ca"/><circle cx="40" cy="180" r="6" class="ok mt"/><path d="M37 180L39 182L43 178" fill="none" stroke="var(--canvas,#ffffff)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="176"><tspan class="s f14 ink">Update </tspan><tspan class="m f14 ink">ca-certificates</tspan></text><text x="64" y="196"><tspan class="s f14 ink">in your images</tspan></text></g><g class="rw" data-beat="4" style="--k: 3"><path d="M40 208V220" class="edge"/><rect x="16" y="220" width="320" height="56" rx="8" class="cv edge node" data-mark="redeploy"/><circle cx="40" cy="248" r="6" class="ok mt"/><path d="M37 248L39 250L43 246" fill="none" stroke="var(--canvas,#ffffff)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="252"><tspan class="s f14 ink">Redeploy, starting with a canary</tspan></text></g><g class="rw" data-beat="5" style="--k: 4"><path d="M40 276V288" class="edge dash"/><rect x="16" y="288" width="320" height="56" rx="8" class="cv edge dash43 node" data-mark="bridge"/><circle cx="40" cy="316" r="6" class="edge dash" fill="none"/><text x="64" y="312"><tspan class="s f14 ghost">Only if you cannot rebuild:</tspan></text><text x="64" y="332"><tspan class="s f14 ghost">add the deny-list</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" data-layout="wide" viewBox="0 0 708 336" role="img" aria-labelledby="go-fix-flow-t go-fix-flow-d" style="aspect-ratio: 708 / 336"><title id="go-fix-flow-t">Rebuild first. The deny-list is only a bridge.</title><desc id="go-fix-flow-d">Go teams find each binary's Go version, rebuild with 1.27.3 or 1.26.10, update ca-certificates, redeploy with a canary, and use the deny-list only if stuck.</desc><style>:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) text{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif;font-weight:400}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .s{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .m{font-family:"JetBrains Mono","JetBrains Mono Fallback",ui-monospace,monospace}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .f14{font-size:14px}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .ink{fill:var(--ink,#151617)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .ghost{fill:var(--ghost,#6c6f72)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .ok{fill:var(--acc-green,#20b46b)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .cv{fill:var(--canvas,#ffffff)}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .edge{stroke:var(--ink,#151617);stroke-opacity:.7;stroke-width:1}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .dash{stroke-dasharray:2 2}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) .dash43{stroke-dasharray:4 3}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.axis,:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.edge,:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.bad,:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) path.hl{fill:none}:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"]) svg[data-layout="compact"]{display:none}@container fig (max-width:559px){:is(#fig-go-fix-flow,[data-fig-clone="go-fix-flow"])
ink,#151617);stroke-opacity:.45;stroke-width:.5}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) path.axis,:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) path.edge,:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) path.bad,:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) path.hl{fill:none}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) svg[data-layout="compact"]{display:none}@container fig (max-width:559px){:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) svg[data-layout="wide"]{display:none}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) svg[data-layout="compact"]{display:block}}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) .e1{--d:var(--dur-enter,240ms)}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) .e2{--d:calc(2*var(--dur-enter,240ms))}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) .e3{--d:calc(2*var(--dur-enter,240ms) + var(--dur-spring-pop,313ms))}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) .pt{transform-box:fill-box;transform-origin:center}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) .bd{transform-box:fill-box;transform-origin:0 50%}@media (prefers-reduced-motion:no-preference){:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed]:not([data-play]) .ax,:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed]:not([data-play]) .ev,:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed]:not([data-play]) .bl,:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed]:not([data-play]) .nv{opacity:0}}@media (prefers-reduced-motion:no-preference){:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed]:not([data-play]) .pt{opacity:0;transform:scale(.5)}}@media (prefers-reduced-motion:no-preference){:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed]:not([data-play]) .bd{transform:scaleX(0)}}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed][data-play] .ax{animation:incident-timeline-fade var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed][data-play] .ev{animation:incident-timeline-fade var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:var(--d)}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed][data-play] .pt{animation:incident-timeline-pop var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:var(--d)}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed][data-play] .pt.sp{animation:incident-timeline-pop var(--dur-spring-pop,313ms) var(--ease-spring-pop,linear(0, 0.0911, 0.2968, 0.5354, 0.7535, 0.9229, 1.0354, 1.0956, 1.115, 1.1072, 1.0846, 1.0572, 1.0315, 1.0111, 0.9973, 0.9896, 0.9868, 0.9874, 0.9898, 0.993, 1)) both;animation-delay:var(--d)}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed][data-play] .bd{animation:incident-timeline-grow var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(3*var(--dur-enter,240ms) + var(--dur-spring-pop,313ms) + var(--k)*var(--dur-enter,240ms))}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed][data-play] .bl{animation:incident-timeline-fade var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(3*var(--dur-enter,240ms) + var(--dur-spring-pop,313ms) + var(--k)*var(--dur-enter,240ms))}:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"])[data-armed][data-play] .nv{animation:incident-timeline-fade var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(6*var(--dur-enter,240ms) + var(--dur-spring-pop,313ms))}@keyframes incident-timeline-fade{from{opacity:0}}@keyframes incident-timeline-pop{from{opacity:0;transform:scale(.5)}}@keyframes incident-timeline-grow{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){:is(#fig-incident-timeline,[data-fig-clone="incident-timeline"]) *{animation:none!important}}</style><defs><pattern id="incident-timeline-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V4" class="hl"/></pattern></defs><g class="ax" data-beat="1"><path d="M80 168H656" class="axis"/><path d="M80 168v4M224 168v4M368 168v4M512 168v4M656 168v4" class="axis"/><text x="80" y="188" class="s f14 ghost mid">0</text><text x="224" y="188" class="s f14 ghost mid">1 day</text><text x="368" y="188" class="s f14 ghost mid">2 days</text><text x="512" y="188" class="s f14 ghost mid">3 days</text><text x="656" y="188" class="s f14 ghost mid">4 days</text></g><g class="ev e1" data-mark="report" data-beat="2"><path d="M80 160V36H88" class="axis"/><text x="92" y="40"><tspan class="s f14 ink">Report</tspan><tspan class="m f14 ghost"> T+0</tspan></text><g class="pt "><circle cx="80" cy="168" r="6" class="ink"/></g></g><g class="ev e2" data-mark="firefox" data-beat="2"><path d="M96 160V76H104" class="axis"/><text x="108" y="80"><tspan class="s f14 ink">Firefox blocks</tspan><tspan class="m f14 ghost"> T+2h53m</tspan></text><g class="pt sp"><circle cx="96" cy="168" r="6" class="ok"/></g></g><g class="ev e3" data-mark="emudhra-revokes" data-beat="2"><path d="M160 160V116H168" class="axis"/><text x="172" y="120"><tspan class="s f14 ink">eMudhra revokes</tspan><tspan class="m f14 ghost"> T+13h18m</tspan></text><g class="pt "><circle cx="160" cy="168" r="6" class="ok"/></g></g><rect x="248" y="208" width="144" height="12" rx="2" class="okbox bd" data-mark="apple" style="--k: 0"/><g class="bl" style="--k: 0"><text x="240" y="220" class="s f14 ink end">Apple: 19 Oct</text></g><rect x="248" y="236" width="288" height="12" rx="2" class="okbox bd" data-mark="go-release" style="--k: 1"/><g class="bl" style="--k: 1"><text x="240" y="248" class="s f14 ink end">Go fix: 19 to 20 Oct</text></g><rect x="392" y="264" width="144" height="12" rx="2" class="okbox bd" data-mark="microsoft" style="--k: 2"/><g class="bl" style="--k: 2"><text x="384" y="276" class="s f14 ink end">Microsoft and public news: 20 Oct</text></g><g class="nv" data-mark="never" data-beat="6"><text x="80" y="296" class="s f14 ink">Devices that never update</text><rect x="80" y="304" width="576" height="8" class="axis" fill="url(#incident-timeline-hatch)"/><path d="M656 308H668" class="edge"/><path d="M664 305L668 308L664 311" class="edge"/></g></svg>

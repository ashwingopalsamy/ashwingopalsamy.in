<svg xmlns="http://www.w3.org/2000/svg" data-layout="compact" viewBox="0 0 360 181.84" role="img" aria-labelledby="safeguards-compact-t safeguards-compact-d" font-family="ui-sans-serif, system-ui, sans-serif"><title id="safeguards-compact-t">What surrounds the model</title><desc id="safeguards-compact-d"></desc><circle cx="30.5" cy="11" r="5" fill="var(--viz-blue,#0278e7)"/><text x="41.5" y="15.5" font-size="12" fill="var(--ghost,#6b6e70)" text-anchor="start" font-weight="400" font-family="inherit">Monitoring</text><circle cx="141" cy="11" r="5" fill="var(--viz-amber,#f59926)"/><text x="152" y="15.5" font-size="12" fill="var(--ghost,#6b6e70)" text-anchor="start" font-weight="400" font-family="inherit">Classifiers</text><circle cx="251.5" cy="11" r="5" fill="var(--viz-violet,#7844f0)"/><text x="262.5" y="15.5" font-size="12" fill="var(--ghost,#6b6e70)" text-anchor="start" font-weight="400" font-family="inherit">Refusal</text><g data-col="Hosted" data-say="Hosted: requests pass through the provider, with classifiers and monitoring around the model."><rect x="0" y="24" width="120" height="157.84" fill="transparent"/><circle cx="60" cy="82.96000000000001" r="44.88" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="monitoring" cx="60" cy="82.96000000000001" r="44.88" fill="none" stroke="var(--viz-blue,#0278e7)" stroke-width="4"/><circle cx="60" cy="82.96000000000001" r="31.28" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="classifiers" cx="60" cy="82.96000000000001" r="31.28" fill="none" stroke="var(--viz-amber,#f59926)" stroke-width="4"/><circle cx="60" cy="82.96000000000001" r="17.68" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="refusal" cx="60" cy="82.96000000000001" r="17.68" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="4"/><circle cx="60" cy="82.96000000000001" r="4.760000000000001" fill="var(--ink,#1a1a1a)"/><text x="60" y="157.84" font-size="13" fill="var(--ink,#1a1a1a)" text-anchor="middle" font-weight="500" font-family="inherit">Hosted</text><text x="60" y="175.84" font-size="12" fill="var(--ghost,#6b6e70)" text-anchor="middle" font-weight="400" font-family="inherit">all three</text></g><g data-col="Downloaded" data-say="Downloaded: no provider in the loop. Only the trained refusal is left."><rect x="120" y="24" width="120" height="157.84" fill="transparent"/><circle cx="180" cy="82.96000000000001" r="44.88" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="monitoring" cx="180" cy="82.96000000000001" r="44.88" fill="none" stroke="var(--viz-blue,#0278e7)" stroke-width="4" opacity="0"/><circle cx="180" cy="82.96000000000001" r="31.28" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="classifiers" cx="180" cy="82.96000000000001" r="31.28" fill="none" stroke="var(--viz-amber,#f59926)" stroke-width="4" opacity="0"/><circle cx="180" cy="82.96000000000001" r="17.68" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="refusal" cx="180" cy="82.96000000000001" r="17.68" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="4"/><circle cx="180" cy="82.96000000000001" r="4.760000000000001" fill="var(--ink,#1a1a1a)"/><text x="180" y="157.84" font-size="13" fill="var(--ink,#1a1a1a)" text-anchor="middle" font-weight="500" font-family="inherit">Downloaded</text><text x="180" y="175.84" font-size="12" fill="var(--ghost,#6b6e70)" text-anchor="middle" font-weight="400" font-family="inherit">refusal only</text></g><g data-col="Abliterated" data-say="Abliterated: the trained refusal is gone too."><rect x="240" y="24" width="120" height="157.84" fill="transparent"/><circle cx="300" cy="82.96000000000001" r="44.88" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="monitoring" cx="300" cy="82.96000000000001" r="44.88" fill="none" stroke="var(--viz-blue,#0278e7)" stroke-width="4" opacity="0"/><circle cx="300" cy="82.96000000000001" r="31.28" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="classifiers" cx="300" cy="82.96000000000001" r="31.28" fill="none" stroke="var(--viz-amber,#f59926)" stroke-width="4" opacity="0"/><circle cx="300" cy="82.96000000000001" r="17.68" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="2.5" stroke-dasharray="5 6"/><circle data-solid="refusal" cx="300" cy="82.96000000000001" r="17.68" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="4" opacity="0"/><circle cx="300" cy="82.96000000000001" r="4.760000000000001" fill="var(--ink,#1a1a1a)"/><text x="300" y="157.84" font-size="13" fill="var(--ink,#1a1a1a)" text-anchor="middle" font-weight="500" font-family="inherit">Abliterated</text><text x="300" y="175.84" font-size="12" fill="var(--ghost,#6b6e70)" text-anchor="middle" font-weight="400" font-family="inherit">none of them</text></g></svg>

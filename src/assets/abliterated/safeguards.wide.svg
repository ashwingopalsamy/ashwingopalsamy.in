<svg xmlns="http://www.w3.org/2000/svg" data-layout="wide" viewBox="0 0 640 228" role="img" aria-labelledby="safeguards-wide-t safeguards-wide-d" font-family="ui-sans-serif, system-ui, sans-serif"><title id="safeguards-wide-t">What surrounds the model</title><desc id="safeguards-wide-d"></desc><circle cx="159" cy="11" r="5" fill="var(--viz-blue,#0278e7)"/><text x="170" y="15.5" font-size="13" fill="var(--ghost,#6b6e70)" text-anchor="start" font-weight="400" font-family="inherit">Monitoring</text><circle cx="278" cy="11" r="5" fill="var(--viz-amber,#f59926)"/><text x="289" y="15.5" font-size="13" fill="var(--ghost,#6b6e70)" text-anchor="start" font-weight="400" font-family="inherit">Classifiers</text><circle cx="397" cy="11" r="5" fill="var(--viz-violet,#7844f0)"/><text x="408" y="15.5" font-size="13" fill="var(--ghost,#6b6e70)" text-anchor="start" font-weight="400" font-family="inherit">Refusal</text><g data-col="Hosted" data-say="Hosted: requests pass through the provider, with classifiers and monitoring around the model."><rect x="0" y="24" width="213.33" height="204" fill="transparent"/><circle cx="106.66666666666667" cy="106" r="66" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="monitoring" cx="106.66666666666667" cy="106" r="66" fill="none" stroke="var(--viz-blue,#0278e7)" stroke-width="4"/><circle cx="106.66666666666667" cy="106" r="46" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="classifiers" cx="106.66666666666667" cy="106" r="46" fill="none" stroke="var(--viz-amber,#f59926)" stroke-width="4"/><circle cx="106.66666666666667" cy="106" r="26" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="refusal" cx="106.66666666666667" cy="106" r="26" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="4"/><circle cx="106.66666666666667" cy="106" r="7" fill="var(--ink,#1a1a1a)"/><text x="106.67" y="202" font-size="14" fill="var(--ink,#1a1a1a)" text-anchor="middle" font-weight="500" font-family="inherit">Hosted</text><text x="106.67" y="222" font-size="13" fill="var(--ghost,#6b6e70)" text-anchor="middle" font-weight="400" font-family="inherit">all three</text></g><g data-col="Downloaded" data-say="Downloaded: no provider in the loop. Only the trained refusal is left."><rect x="213.33" y="24" width="213.33" height="204" fill="transparent"/><circle cx="320" cy="106" r="66" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="monitoring" cx="320" cy="106" r="66" fill="none" stroke="var(--viz-blue,#0278e7)" stroke-width="4" opacity="0"/><circle cx="320" cy="106" r="46" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="classifiers" cx="320" cy="106" r="46" fill="none" stroke="var(--viz-amber,#f59926)" stroke-width="4" opacity="0"/><circle cx="320" cy="106" r="26" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="refusal" cx="320" cy="106" r="26" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="4"/><circle cx="320" cy="106" r="7" fill="var(--ink,#1a1a1a)"/><text x="320" y="202" font-size="14" fill="var(--ink,#1a1a1a)" text-anchor="middle" font-weight="500" font-family="inherit">Downloaded</text><text x="320" y="222" font-size="13" fill="var(--ghost,#6b6e70)" text-anchor="middle" font-weight="400" font-family="inherit">refusal only</text></g><g data-col="Abliterated" data-say="Abliterated: the trained refusal is gone too."><rect x="426.67" y="24" width="213.33" height="204" fill="transparent"/><circle cx="533.3333333333334" cy="106" r="66" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="monitoring" cx="533.3333333333334" cy="106" r="66" fill="none" stroke="var(--viz-blue,#0278e7)" stroke-width="4" opacity="0"/><circle cx="533.3333333333334" cy="106" r="46" fill="none" stroke="var(--ghost,#6b6e70)" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/><circle data-solid="classifiers" cx="533.3333333333334" cy="106" r="46" fill="none" stroke="var(--viz-amber,#f59926)" stroke-width="4" opacity="0"/><circle cx="533.3333333333334" cy="106" r="26" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="2.5" stroke-dasharray="5 6"/><circle data-solid="refusal" cx="533.3333333333334" cy="106" r="26" fill="none" stroke="var(--viz-violet,#7844f0)" stroke-width="4" opacity="0"/><circle cx="533.3333333333334" cy="106" r="7" fill="var(--ink,#1a1a1a)"/><text x="533.33" y="202" font-size="14" fill="var(--ink,#1a1a1a)" text-anchor="middle" font-weight="500" font-family="inherit">Abliterated</text><text x="533.33" y="222" font-size="13" fill="var(--ghost,#6b6e70)" text-anchor="middle" font-weight="400" font-family="inherit">none of them</text></g></svg>

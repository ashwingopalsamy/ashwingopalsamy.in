# eMudhra tracker: refreshes src/data/emudhra-incident.json and the tracker blocks in the post, then opens one PR.
#
# NOT ENABLED FOR SCHEDULING UNTIL THE POST IS MERGED. GitHub runs `schedule` triggers only from the default
# branch, so this file ships disabled by living on the feature branch; it starts running the moment it lands on
# main together with the post. Until then only a manual workflow_dispatch from this branch can run it.
#
# Safety: this job never pushes to main and never enables auto-merge. It force-pushes only the bot branch
# (regenerated from main on every run) and opens or updates a single PR for a human to review and merge.
# The only credential is GITHUB_TOKEN. Pull requests created with GITHUB_TOKEN do not trigger other workflows,
# so CI will not start on the bot PR by itself; close and reopen it (or push to the branch) to run the checks.
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on.
name: eMudhra tracker

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two syncs at once, and never cancel one mid-push.
concurrency:
  group: emudhra-tracker
  cancel-in-progress: false

env:
  POST: src/content/library/notes/emudhra-ca-key-compromise-go-developers.md
  DATA: src/data/emudhra-incident.json
  BRANCH: bot/emudhra-tracker
  # The tracker retires itself: every run after this date (UTC) exits successfully without doing anything.
  RETIRE_ON: "2026-12-01"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Retirement gate
        id: gate
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "$RETIRE_ON" ]]; then
            echo "Tracker retired after $RETIRE_ON (today is $today); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Credentials stay persisted because the push below needs them; the token is the job-scoped GITHUB_TOKEN.
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The script has no dependencies, so there is no npm install. stdout is the change summary (PR body).
      - name: Sync tracker data and post blocks
        if: steps.gate.outputs.skip != 'true'
        run: |
          node scripts/sync-emudhra-tracker.mjs --post "$POST" > "$RUNNER_TEMP/tracker-summary.md"
          cat "$RUNNER_TEMP/tracker-summary.md"

      - name: Open or update the tracker PR
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- "$DATA" "$POST"; then
            echo "No change; no PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -- "$DATA" "$POST"
          git commit -m "chore(tracker): sync eMudhra incident tracker"
          # Only the bot branch is ever force-pushed; it is rebuilt from main each run, so the PR stays one commit.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          {
            echo "Automated sync of the eMudhra incident tracker. Review the changed values against the upstream source, then merge or close."
            echo
            cat "$RUNNER_TEMP/tracker-summary.md"
            echo
            echo "Source: https://github.com/galadran/we-have-a-problem.com"
            echo "Generated by .github/workflows/emudhra-tracker.yml. This branch is rebuilt from main on every run; do not commit to it."
          } > "$RUNNER_TEMP/pr-body.md"

          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated PR #$number."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(tracker): sync eMudhra incident tracker" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

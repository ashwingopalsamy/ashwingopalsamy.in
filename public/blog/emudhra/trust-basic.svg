one="trust-basic"])[data-armed][data-play] .b1{animation:trust-basic-rise var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both}:is(#fig-trust-basic,[data-fig-clone="trust-basic"])[data-armed][data-play] .a1{animation:trust-basic-fade var(--dur-tint,110ms) linear both;animation-delay:var(--dur-enter,240ms)}:is(#fig-trust-basic,[data-fig-clone="trust-basic"])[data-armed][data-play] .sp{animation:trust-basic-grow var(--dur-spring-soft,189ms) var(--ease-spring-soft,linear(0, 0.027, 0.0936, 0.1824, 0.2812, 0.3814, 0.4774, 0.566, 0.6452, 0.7144, 0.7736, 0.8233, 0.8645, 0.8979, 0.9247, 0.9459, 0.9623, 0.9749, 0.9842, 0.9911, 1)) both;animation-delay:calc(var(--dur-enter,240ms) + var(--dur-tint,110ms))}:is(#fig-trust-basic,[data-fig-clone="trust-basic"])[data-armed][data-play] .a2{animation:trust-basic-fade var(--dur-tint,110ms) linear both;animation-delay:calc(var(--dur-enter,240ms) + var(--dur-tint,110ms) + var(--dur-spring-soft,189ms))}:is(#fig-trust-basic,[data-fig-clone="trust-basic"])[data-armed][data-play] .b5{animation:trust-basic-rise var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(var(--dur-enter,240ms) + 2*var(--dur-tint,110ms) + var(--dur-spring-soft,189ms))}:is(#fig-trust-basic,[data-fig-clone="trust-basic"])[data-armed][data-play] .b6{animation:trust-basic-slide var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(2*var(--dur-enter,240ms) + 2*var(--dur-tint,110ms) + var(--dur-spring-soft,189ms))}:is(#fig-trust-basic,[data-fig-clone="trust-basic"])[data-armed][data-play] .cn{animation:trust-basic-fade var(--dur-tint,110ms) linear both;animation-delay:calc(3*var(--dur-enter,240ms) + 2*var(--dur-tint,110ms) + var(--dur-spring-soft,189ms))}@keyframes trust-basic-rise{from{opacity:0;transform:translateY(4px)}}@keyframes trust-basic-fade{from{opacity:0}}@keyframes trust-basic-grow{from{opacity:0;transform:scale(.96)}}@keyframes trust-basic-slide{from{opacity:0;transform:translateX(8px)}}@media (prefers-reduced-motion:reduce){:is(#fig-trust-basic,[data-fig-clone="trust-basic"]) *{animation:none!important}}</style><g class="b1" data-beat="1"><rect x="16" y="24" width="432" height="80" rx="8" class="cv edge node" data-mark="root"/><text x="40" y="56" class="s f14 w ink">Root CA</text><text x="40" y="84" class="s f14 ghost">Kept offline, locked away</text><rect x="404" y="56" width="24" height="20" rx="4" class="edge" fill="none"/><path d="M408 56V52a8 8 0 0 1 16 0V56" class="edge"/></g><g class="a1" data-beat="2"><path d="M232 104V136" class="edge"/><path d="M229 132L232 136L235 132" class="edge"/></g><g class="sp" data-beat="3"><rect x="16" y="136" width="432" height="80" rx="8" class="cv sk node" data-mark="stamp"/><text x="40" y="168" class="s f14 w ink">Intermediate CA</text><text x="40" y="196" class="s f14 ghost">The stamp, used every day</text></g><g class="a2" data-beat="4"><path d="M232 216V248" class="edge"/><path d="M229 244L232 248L235 244" class="edge"/></g><g class="b5" data-beat="5"><rect x="16" y="248" width="432" height="80" rx="8" class="cv edge node" data-mark="bank"/><text x="40" y="280" class="s f14 w ink">Your bank's certificate</text><text x="40" y="308" class="s f14 ghost">What your app checks</text></g><g class="b6" data-beat="6"><rect x="496" y="24" width="196" height="88" rx="8" class="cell edge node" data-mark="list"/><text x="516" y="52" class="s f14 ink">Your phone or server</text><text x="516" y="72" class="s f14 ink">keeps a list of roots</text><text x="516" y="92" class="s f14 ink">it trusts</text></g><g class="cn" data-beat="7"><path d="M496 64H448" class="edge dash"/><path d="M452 61L448 64L452 67" class="edge"/></g></svg>

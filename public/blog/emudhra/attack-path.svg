<svg id="fig-attack-path" width="708" height="424" data-armed="" data-play="" xmlns="http://www.w3.org/2000/svg" data-layout="wide" viewBox="0 0 708 424" role="img" aria-labelledby="attack-path-t attack-path-d" style="aspect-ratio: 708 / 424"><title id="attack-path-t">A fake certificate only works on an app that skips blocklists.</title><desc id="attack-path-d">A fake bank certificate needs an attacker on your network and an app that skips blocklists, so updated browsers reject it and old programs accept it.</desc><style>#fig-attack-path{--canvas:#ffffff;--ink:#151617;--ghost:#6c6f72;--faint:#2c2e30;--edge:rgba(21,22,23,0.11);--edge-soft:rgba(21,22,23,0.08);--edge-strong:rgba(21,22,23,0.2);--wash:rgba(21,22,23,0.045);--acc-violet:#7844f0;--acc-green:#20b46b;--acc-amber:#f59926;--acc-red:#ee343b;--acc-blue:#0278e7;--ok-wash:rgba(32,180,107,0.13);--err-wash:rgba(238,52,59,0.11)}@media (prefers-color-scheme:dark){#fig-attack-path{--canvas:#151617;--ink:#ffffff;--ghost:#abaeb1;--faint:#cbced0;--edge:rgba(255,255,255,0.13);--edge-soft:rgba(255,255,255,0.08);--edge-strong:rgba(255,255,255,0.24);--wash:rgba(255,255,255,0.06);--acc-violet:#8f69ff;--acc-green:#43c07a;--acc-amber:#f8a13f;--acc-red:#f4514f;--acc-blue:#3792fd;--ok-wash:rgba(67,192,122,0.17);--err-wash:rgba(244,81,79,0.17)}}:is(#fig-attack-path,[data-fig-clone="attack-path"]) text{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif;font-weight:400}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .s{font-family:"Inter Variable","Inter Fallback",system-ui,-apple-system,sans-serif}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .m{font-family:"JetBrains Mono","JetBrains Mono Fallback",ui-monospace,monospace}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .f14{font-size:14px}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .w{font-weight:550}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .ink{fill:var(--ink,#151617)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .ghost{fill:var(--ghost,#6c6f72)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .key{fill:var(--acc-violet,#7844f0)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .ok{fill:var(--acc-green,#20b46b)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .cv{fill:var(--canvas,#ffffff)}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .okbox{fill:var(--ok-wash,rgba(32,180,107,0.13));stroke:var(--acc-green,#20b46b);stroke-width:1}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .edge{stroke:var(--ink,#151617);stroke-opacity:.7;stroke-width:1}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .bad{stroke:var(--acc-red,#ee343b);stroke-width:1.5}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .washb{fill:var(--err-wash,rgba(238,52,59,0.11))}:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.axis,:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.edge,:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.bad,:is(#fig-attack-path,[data-fig-clone="attack-path"]) path.hl{fill:none}:is(#fig-attack-path,[data-fig-clone="attack-path"]) svg[data-layout="compact"]{display:none}@container fig (max-width:559px){:is(#fig-attack-path,[data-fig-clone="attack-path"]) svg[data-layout="wide"]{display:none}:is(#fig-attack-path,[data-fig-clone="attack-path"]) svg[data-layout="compact"]{display:block}}:is(#fig-attack-path,[data-fig-clone="attack-path"]) .acg,:is(#fig-attack-path,[data-fig-clone="attack-path"]) .acr{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .st,:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .rjg{opacity:0;transform:translateY(4px)}}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .fk{opacity:0}}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .acg{opacity:0;transform:scale(.96)}}@media (prefers-reduced-motion:no-preference){:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .rjr,:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed]:not([data-play]) .acr{fill:var(--canvas,#ffffff);stroke:var(--edge,rgba(21,22,23,0.11))}}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .st{animation:attack-path-rise var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(var(--k)*var(--dur-enter,240ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .fk{animation:attack-path-fade var(--dur-tint,110ms) linear both;animation-delay:calc(4*var(--dur-enter,240ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .rjg{animation:attack-path-rise var(--dur-enter,240ms) var(--ease-enter,cubic-bezier(0.16, 1, 0.3, 1)) both;animation-delay:calc(4*var(--dur-enter,240ms) + var(--dur-tint,110ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .rjr{animation:attack-path-ok var(--dur-tint,110ms) linear both;animation-delay:calc(5*var(--dur-enter,240ms) + var(--dur-tint,110ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .acg{animation:attack-path-grow var(--dur-spring-pop,313ms) var(--ease-spring-pop,linear(0, 0.0911, 0.2968, 0.5354, 0.7535, 0.9229, 1.0354, 1.0956, 1.115, 1.1072, 1.0846, 1.0572, 1.0315, 1.0111, 0.9973, 0.9896, 0.9868, 0.9874, 0.9898, 0.993, 1)) both;animation-delay:calc(5*var(--dur-enter,240ms) + var(--dur-tint,110ms))}:is(#fig-attack-path,[data-fig-clone="attack-path"])[data-armed][data-play] .acr{animation:attack-path-bad var(--dur-tint,110ms) linear both;animation-delay:calc(5*var(--dur-enter,240ms) + var(--dur-tint,110ms))}@keyframes attack-path-rise{from{opacity:0;transform:translateY(4px)}}@keyframes attack-path-fade{from{opacity:0}}@keyframes attack-path-grow{from{opacity:0;transform:scale(.96)}}@keyframes attack-path-ok{from{fill:var(--canvas,#ffffff);stroke:var(--edge,rgba(21,22,23,0.11))}}@keyframes attack-path-bad{from{fill:var(--canvas,#ffffff);stroke:var(--edge,rgba(21,22,23,0.11))}}@media (prefers-reduced-motion:reduce){:is(#fig-attack-path,[data-fig-clone="attack-path"]) *{animation:none!important}}</style><g class="st" data-beat="1" style="--k: 0"><rect x="16" y="16" width="676" height="56" rx="8" class="cv edge node" data-mark="step-1"/><text y="48"><tspan x="40" class="m f14 ghost">1</tspan><tspan x="72" class="s f14 ink">The attacker sits between you and the server.</tspan></text></g><g class="st" data-beat="2" style="--k: 1"><path d="M352 72V96" class="edge"/><path d="M349 92L352 96L355 92" class="edge"/><rect x="16" y="96" width="676" height="56" rx="8" class="cv edge node" data-mark="step-2"/><text y="128"><tspan x="40" class="m f14 ghost">2</tspan><tspan x="72" class="s f14 ink">The attacker knows a stamp's secret key. Anyone can: it is </tspan><tspan class="m f14 w key">1 to 255</tspan><tspan class="s f14 ink">.</tspan></text></g><g class="st" data-beat="3" style="--k: 2"><path d="M352 152V176" class="edge"/><path d="M349 172L352 176L355 172" class="edge"/><rect x="16" y="176" width="676" height="56" rx="8" class="cv edge node" data-mark="step-3"/><text y="208"><tspan x="40" class="m f14 ghost">3</tspan><tspan x="72" class="s f14 ink">The attacker makes a fake certificate for your bank.</tspan></text></g><g class="st" data-beat="4" style="--k: 3"><path d="M352 232V256" class="edge"/><path d="M349 252L352 256L355 252" class="edge"/><rect x="16" y="256" width="676" height="56" rx="8" class="cv edge node" data-mark="step-4"/><text y="288"><tspan x="40" class="m f14 ghost">4</tspan><tspan x="72" class="s f14 ink">Your app accepts it, unless it checks blocklists.</tspan></text></g><g class="fk" data-beat="5"><path d="M352 312V328H180V352M352 328H528V352" class="edge"/><path d="M177 348L180 352L183 348" class="edge"/><path d="M525 348L528 352L531 348" class="edge"/></g><g class="rjg" data-beat="6" data-mark="rejects"><rect x="16" y="352" width="328" height="56" rx="8" class="okbox rjr node"/><circle cx="44" cy="380" r="6" class="ok"/><path d="M41 380L43 382L47 378" fill="none" stroke="var(--canvas,#ffffff)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="384"><tspan class="s f14 ink">Updated browser: </tspan><tspan class="s f14 w ink">rejects it</tspan></text></g><g class="acg" data-beat="7" data-mark="accepts"><rect x="364" y="352" width="328" height="56" rx="8" class="washb bad acr node"/><circle cx="392" cy="380" r="5.25" fill="none" class="bad"/><text x="412" y="384"><tspan class="s f14 ink">Old program: </tspan><tspan class="s f14 w ink">accepts it</tspan></text></g></svg>
